name: Revenue

tables:

  # =======================
  # FACT TABLE: DAILY_REVENUE
  # =======================
  - name: daily_revenue
    description: Daily revenue, COGS, forecast, and product/region mapping.
    base_table:
      database: CORTEX_ANALYST_DEMO
      schema: REVENUE_TIMESERIES
      table: DAILY_REVENUE

    primary_key:
      columns: [date, product_id, region_id]

    time_dimensions:
      - name: date
        expr: date
        unique: true
        data_type: date
        description: Date of the revenue record.

    measures:
      - name: revenue
        expr: revenue
        description: Actual daily revenue
        default_aggregation: sum
        data_type: number

      - name: cogs
        expr: cogs
        description: Daily cost of goods sold
        default_aggregation: sum
        data_type: number

      - name: forecasted_revenue
        expr: forecasted_revenue
        description: Daily forecasted revenue
        default_aggregation: sum
        data_type: number

      - name: profit
        expr: revenue - cogs
        description: Profit = Revenue - COGS
        default_aggregation: sum
        data_type: number

    dimensions:
      - name: product_id
        expr: product_id
        data_type: number

      - name: region_id
        expr: region_id
        data_type: number


  # =======================
  # DIM-LIKE TABLE: DAILY_REVENUE_BY_PRODUCT
  # =======================
  - name: revenue_by_product
    description: Revenue table enriched with product information.
    base_table:
      database: CORTEX_ANALYST_DEMO
      schema: REVENUE_TIMESERIES
      table: DAILY_REVENUE_BY_PRODUCT

    primary_key:
      columns: [date, product_id]

    dimensions:
      - name: product_id
        expr: product_id
        data_type: number

      - name: product_line
        expr: product_line
        data_type: varchar
        sample_values:
          - Electronics
          - Clothing
          - Home Appliances
          - Toys
          - Books


  # =======================
  # DIM-LIKE TABLE: DAILY_REVENUE_BY_REGION
  # =======================
  - name: revenue_by_region
    description: Revenue enriched with region and geography attributes.
    base_table:
      database: CORTEX_ANALYST_DEMO
      schema: REVENUE_TIMESERIES
      table: DAILY_REVENUE_BY_REGION

    primary_key:
      columns: [date, region_id]

    dimensions:
      - name: region_id
        expr: region_id
        data_type: number

      - name: sales_region
        expr: sales_region
        data_type: varchar

      - name: state
        expr: state
        data_type: varchar


# =======================
# RELATIONSHIPS
# =======================
relationships:

  - name: revenue_to_product
    left_table: daily_revenue
    right_table: revenue_by_product
    relationship_columns:
      - left_column: product_id
        right_column: product_id
    relationship_type: many_to_one
    join_type: left_outer

  - name: revenue_to_region
    left_table: daily_revenue
    right_table: revenue_by_region
    relationship_columns:
      - left_column: region_id
        right_column: region_id
    relationship_type: many_to_one
    join_type: left_outer


# =======================
# VERIFIED QUERIES
# =======================
verified_queries:

  - name: "daily cumulative expenses in 2023 dec"
    question: "daily cumulative expenses in 2023 dec"
    verified_at: 1714752498
    verified_by: renee
    sql: |
      SELECT
        date,
        SUM(cogs) OVER (
          ORDER BY date
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        ) AS cumulative_cogs
      FROM revenue.daily_revenue
      WHERE date BETWEEN '2023-12-01' AND '2023-12-31'
      ORDER BY date DESC;

  - name: "lowest revenue each month"
    question: "For each month, what was the lowest daily revenue and on what date did that lowest revenue occur?"
    verified_at: 1715187400
    verified_by: renee
    sql: |
      WITH monthly_min AS (
        SELECT
          DATE_TRUNC('MONTH', date) AS month,
          MIN(revenue) AS min_revenue
        FROM revenue.daily_revenue
        GROUP BY 1
      )
      SELECT
        m.month,
        m.min_revenue,
        dr.date AS min_revenue_date
      FROM monthly_min m
      JOIN revenue.daily_revenue dr
        ON DATE_TRUNC('MONTH', dr.date) = m.month
       AND dr.revenue = m.min_revenue
      ORDER BY m.month DESC;
